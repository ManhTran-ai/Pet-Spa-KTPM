services:
  postgres:
    image: postgres:16-alpine
    container_name: petspa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petspa
      POSTGRES_PASSWORD: petspa
      POSTGRES_DB: petspa
    ports:
      - '5432:5432'
    volumes:
      - petspa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petspa']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  petspa-pgdata:
