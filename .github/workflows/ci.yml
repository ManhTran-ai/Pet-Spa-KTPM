name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Chất lượng testware và Gate tài liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Kiểm tra yêu cầu (SRS) và truy xuất hai chiều (RTM)
        run: |
          npm run req:check
          npm run rtm:check

      - name: Chấm Exit criteria
        run: npm run exit:check

      - name: Lưu kết quả Gate
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            reports/execution-log.csv
            reports/exit-criteria.md
            reports/rtm-coverage.md
            reports/raw/req-check.md

  # Chỉ chạy khi có biến môi trường cho phép; tránh tạo tải lên site đích
  # ngoài ranh giới ADR-11 (tần suất thấp, chỉ GET).
  e2e:
    name: Kiểm thử E2E trên 3 site đích
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Chạy E2E
        run: npx playwright test
        env:
          TARGET_BASE_URL: ${{ vars.TARGET_BASE_URL }}

      - name: Đồng bộ nhật ký thực thi
        run: npm run exec:sync

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/playwright-html/
